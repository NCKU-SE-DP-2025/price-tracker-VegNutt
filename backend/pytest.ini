[pytest]
pythonpath = .
testpaths = tests
addopts = --strict-markers

[coverage:run]
source = api,services,models,db,core
omit = 
    */tests/*
    */__pycache__/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
